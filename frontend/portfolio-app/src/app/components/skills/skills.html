<section class="skills" id="skills">
  <div class="container">
    <div class="skills-header" appReveal>
      <div class="section-kicker">What I Use</div>
      <h2 class="section-title">Technical Skills</h2>
      <div class="skills-underline"></div>
      <p class="section-hint skills-hint">Technologies and tools I use to build modern, scalable applications and data solutions.</p>
    </div>

    <div class="skills-grid">
      @for (category of skills; track category.title) {
        <button
          type="button"
          class="skill-category"
          appReveal
          [class.selected]="isSelected(category.title)"
          (click)="toggleSelected(category.title)"
          [attr.aria-pressed]="isSelected(category.title)"
        >
          <div class="skill-category-head">
            <div class="skill-category-icon">
              @switch (category.icon) {
                @case ('code') {
                  <span class="glyph-text">&lt;/&gt;</span>
                }
                @case ('server') {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="14" rx="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                  </svg>
                }
                @case ('database') {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5.5" rx="8" ry="3"></ellipse>
                    <path d="M4 5.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
                    <path d="M4 11.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
                  </svg>
                }
                @case ('chart') {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="20" x2="5" y2="13"></line>
                    <line x1="12" y1="20" x2="12" y2="8"></line>
                    <line x1="19" y1="20" x2="19" y2="4"></line>
                  </svg>
                }
                @case ('cloud') {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.6A3.5 3.5 0 0 0 7 18Z"></path>
                  </svg>
                }
                @case ('tools') {
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6a1.5 1.5 0 0 0 2 2l6-6a4 4 0 0 0 5.4-5.4l-2.4 2.4-2-2Z"></path>
                  </svg>
                }
              }
            </div>
            <h3 class="skill-category-title">{{ category.title }}</h3>
          </div>

          <div class="skill-items">
            @for (item of category.items; track item.name) {
              <div
                class="skill-item"
                [class.highlighted]="highlightedSkills.includes(item.name)"
              >
                <span class="skill-item-icon">
                  @if (item.iconType === 'cdn') {
                    <img [src]="cdnIconUrl(item.icon)" [alt]="item.name" width="20" height="20">
                  } @else {
                    @switch (item.icon) {
                      @case ('csharp') {
                        <span class="badge" style="background:#9B4F96"><span class="badge-text">C#</span></span>
                      }
                      @case ('restapi') {
                        <span class="badge" style="background:#0EA5E9">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.6A3.5 3.5 0 0 0 7 18Z"></path>
                          </svg>
                        </span>
                      }
                      @case ('efcore') {
                        <span class="badge" style="background:#512BD4">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="7" x2="20" y2="7"></line>
                            <line x1="4" y1="12" x2="20" y2="12"></line>
                            <line x1="4" y1="17" x2="20" y2="17"></line>
                          </svg>
                        </span>
                      }
                      @case ('sqlserver') {
                        <span class="badge" style="background:#CC2927">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5.5" rx="7" ry="2.6"></ellipse>
                            <path d="M5 5.5v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"></path>
                            <path d="M5 11.5v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"></path>
                          </svg>
                        </span>
                      }
                      @case ('powerbi') {
                        <span class="badge" style="background:#F2C811">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="6" y1="19" x2="6" y2="13"></line>
                            <line x1="12" y1="19" x2="12" y2="8"></line>
                            <line x1="18" y1="19" x2="18" y2="5"></line>
                          </svg>
                        </span>
                      }
                      @case ('dax') {
                        <span class="badge" style="background:#2CA02C"><span class="badge-text small">DAX</span></span>
                      }
                      @case ('powerquery') {
                        <span class="badge" style="background:#2C9E9E">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                            <line x1="4" y1="12" x2="20" y2="12"></line>
                            <line x1="12" y1="4" x2="12" y2="20"></line>
                          </svg>
                        </span>
                      }
                      @case ('datamodeling') {
                        <span class="badge" style="background:#2C9E9E">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3 20 7.5v9L12 21 4 16.5v-9Z"></path>
                            <path d="M4 7.5 12 12l8-4.5"></path>
                            <line x1="12" y1="12" x2="12" y2="21"></line>
                          </svg>
                        </span>
                      }
                      @case ('semanticmodels') {
                        <span class="badge" style="background:#2C9E9E">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="6" cy="7" r="2"></circle>
                            <circle cx="18" cy="7" r="2"></circle>
                            <circle cx="12" cy="18" r="2"></circle>
                            <line x1="7.6" y1="8.2" x2="10.6" y2="16.2"></line>
                            <line x1="16.4" y1="8.2" x2="13.4" y2="16.2"></line>
                            <line x1="8" y1="7" x2="16" y2="7"></line>
                          </svg>
                        </span>
                      }
                      @case ('fabric') {
                        <span class="badge badge-gradient">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="#fff">
                            <path d="M12 2 21 7.5 12 13 3 7.5Z"></path>
                            <path d="M3 12.5 12 18l9-5.5-4-2.4-5 3-5-3Z" opacity="0.7"></path>
                          </svg>
                        </span>
                      }
                      @case ('onelake') {
                        <span class="badge" style="background:#0F6CBD">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="#fff">
                            <path d="M12 3c3 4.2 6 7.7 6 11a6 6 0 0 1-12 0c0-3.3 3-6.8 6-11Z"></path>
                          </svg>
                        </span>
                      }
                      @case ('lakehouse') {
                        <span class="badge" style="background:#3B82C4">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 11 12 4l8 7"></path>
                            <path d="M6 10v9h12v-9"></path>
                          </svg>
                        </span>
                      }
                      @case ('warehouse') {
                        <span class="badge" style="background:#2461A8">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 21V10l9-6 9 6v11"></path>
                            <line x1="3" y1="21" x2="21" y2="21"></line>
                            <line x1="9" y1="21" x2="9" y2="13"></line>
                            <line x1="15" y1="21" x2="15" y2="13"></line>
                          </svg>
                        </span>
                      }
                      @case ('dataflows') {
                        <span class="badge" style="background:#F2C811">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="#1f1f1f">
                            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"></path>
                          </svg>
                        </span>
                      }
                      @case ('pipelines') {
                        <span class="badge" style="background:#B08968">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 8h9a3 3 0 0 1 0 6H4"></path>
                            <path d="M20 16h-9a3 3 0 0 1 0-6"></path>
                          </svg>
                        </span>
                      }
                      @case ('kql') {
                        <span class="badge" style="background:#2C9E9E">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3,16 8,9 12,13 21,4"></polyline>
                          </svg>
                        </span>
                      }
                      @case ('azure') {
                        <span class="badge" style="background:#0078D4">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="#fff">
                            <path d="M9.5 3h5L20 18h-4.3l-1.4-4H9l-1.6 4H3Z"></path>
                          </svg>
                        </span>
                      }
                      @case ('azuredevops') {
                        <span class="badge" style="background:#0078D4">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="1.8">
                            <circle cx="7.5" cy="12" r="4.5"></circle>
                            <circle cx="16.5" cy="12" r="4.5"></circle>
                          </svg>
                        </span>
                      }
                      @case ('vscode') {
                        <span class="badge" style="background:#007ACC"><span class="badge-text small">VS</span></span>
                      }
                    }
                  }
                </span>
                <span class="skill-item-name">{{ item.name }}</span>
                @if (item.projectCount > 0) {
                  <span class="skill-item-count">{{ item.projectCount }} {{ item.projectCount === 1 ? 'project' : 'projects' }}</span>
                }
              </div>
            }
          </div>
        </button>
      }
    </div>
  </div>
</section>
